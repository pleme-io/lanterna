[package]
name = "lanterna-mcp"
description = "lanterna-mcp — the observe-only ClickHouse MCP server (stdio). Twelve clickhouse_* tools; every answer is one of kotae's four outcomes, and there is no mutating tool because the client has no mutating method and no raw-SQL entry point"
keywords = ["clickhouse", "mcp", "observability", "agent"]
categories = ["command-line-utilities"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "lanterna-mcp"
path = "src/main.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
lanterna.workspace = true
kotae.workspace = true
shikumi.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
lanterna = { workspace = true, features = ["mock"] }
tempfile.workspace = true
